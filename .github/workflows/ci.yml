name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest --junitxml=reports/pytest.xml
      - run: software-factory validate-config config/factory.example.yaml
  blueprint-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate blueprint manifests
        run: |
          python -m json.tool blueprints/react-frontend/package.json >/dev/null
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('blueprints/java-backend/pom.xml')
          print('Blueprint manifests parse successfully')
          PY
      - name: Require caller-supplied immutable container bases
        run: |
          grep -R '^ARG BASE_IMAGE$' blueprints/*/Dockerfile
          test "$(grep -R '^FROM ${BASE_IMAGE}$' blueprints/*/Dockerfile | wc -l)" -eq 2
