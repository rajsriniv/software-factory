[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sdlc-software-factory"
version = "0.1.0"
description = "A governed multi-agent software delivery control plane"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6.0.12,<7"]

[project.scripts]
software-factory = "software_factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
