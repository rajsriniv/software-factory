name: AWS deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, stage, prod]
      image_digest:
        description: Previously tested sha256 artifact digest
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - working-directory: blueprints/aws-terraform
        run: |
          terraform fmt -check
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=software-factory/${{ inputs.environment }}/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          terraform validate
          terraform plan -out=tfplan -var="aws_region=${{ vars.AWS_REGION }}" -var="environment=${{ inputs.environment }}" -var="image_digest=${{ inputs.image_digest }}"
          terraform show -json tfplan > tfplan.json
          sha256sum tfplan .terraform.lock.hcl > tfplan.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-plan-${{ inputs.environment }}
          path: |
            blueprints/aws-terraform/tfplan
            blueprints/aws-terraform/tfplan.json
            blueprints/aws-terraform/tfplan.sha256
            blueprints/aws-terraform/.terraform.lock.hcl
          retention-days: 7
  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reviewed-plan-${{ inputs.environment }}
          path: blueprints/aws-terraform
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - working-directory: blueprints/aws-terraform
        run: |
          sha256sum -c tfplan.sha256
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=software-factory/${{ inputs.environment }}/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          sha256sum -c tfplan.sha256
          terraform apply tfplan
